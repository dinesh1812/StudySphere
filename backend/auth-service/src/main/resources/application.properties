spring.application.name=auth-service
server.port=8082

# Eureka Service Registry
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}

# Database Connection (USER DB)
spring.datasource.url=${USERS_DATASOURCE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# IMPORTANT: Set to 'none' because User Service handles table creation
spring.jpa.hibernate.ddl-auto=none

# JWT Configuration (This is a 256-bit Hex encoded secret. In production, store this in env variables)
# Uses the environment variable if present, otherwise uses the default local string
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000